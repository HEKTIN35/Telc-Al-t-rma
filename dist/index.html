sich ein Dieb Schmuck in seiner Tasche verschwinden. „Fast wie ein Magier“,
beschreibt Josh Davis, Psychologe an der englischen University of Greenwich, die
Szene. Ein Polizist einer Sondereinheit des Scotland Yard, der Londoner Polizei,
sieht die Bilder und erkennt den Täter sofort: (0) Tagelang habe der Beamte weitere
Überwachungsvideos durchforstet, erzählt Davis, und dem Unbekannten mehr als
40 Diebstahlsvideos zugeordnet. Schließlich wird der Täter gefasst. Der Polizist,
der den Dieb auf mehr als 40 Überwachungsvideos erkannte, wird als Super-
Recogniser bezeichnet. [[1]] Dass es Leute gibt, die ein Gesicht nicht vergessen oder
auf noch so verschwommenen Fotos Personen wiedererkennen, weiß die
Wissenschaft erst seit wenigen Jahren. Die Forschung steckt zwar noch in den
Kinderschuhen. [[2]] Die Wissenschaftler stolperten eher zufällig über diese
besondere Fähigkeit von Menschen. Eigentlich untersuchten sie die sogenannte
Prosopagnosie, Gesichtsblindheit. [[3]] Im Extremfall erkennen sie sogar
Familienmitglieder nicht. Während der Forschungsarbeit wurden die
Wissenschaftler von Menschen kontaktiert, die das Gegenteil von sich
behaupteten, nämlich dass sie sich besonders gut Gesichter merken könnten.
Einige dieser Personen testeten die Forscher daraufhin: Alle Testpersonen
schnitten bei Gesichtserkennungstests deutlich besser ab als der Durchschnitt. „Die
meisten Super-Recogniser sind sich ihrer seltenen Begabung gar nicht bewusst“,
sagt Davis. „Sie merken z. B., dass sie besonders gut Schauspieler in kleinen
Nebenrollen wiedererkennen können, oder berichten von peinlichen
Schlüsselerlebnissen, etwa, dass sie auf der Straße jemanden wiedererkannten, der
sich überhaupt nicht an sie erinnerte.“
[[4]] Davis schätzt den Anteil auf unter ein Prozent der Bevölkerung.
Doch was macht einen Super-Recogniser aus? Sarah Bate, Psychologin an der
britischen Bournemouth Universität, hält es für gut möglich, dass diese Menschen
durchaus unterschiedliche Stärken haben, wenn es um das Erkennen von
Gesichtern geht. So können sich einige sehr gut an Gesichter erinnern, selbst nach
flüchtigen Begegnungen. [[5]] Und manche können am besten Personen in
einer großen Menschenmenge ausfindig machen.
Vor einigen Jahren gründete die Londoner Polizei eine eigene Einheit von Super-
Recognisern. Die Polizisten sind den besten Computerprogrammen zur
Gesichtserkennung noch weit voraus: Bei 1000 Bildern, auf denen zur
Identifizierung Verdächtige gesucht werden, erkennt die Software derzeit nur
einen. Die besonderen Begabungen der Super-Recogniser sind weitgehend
unerforscht. [[6]] Auch haben sie nach dem derzeitigen Wissensstand weder etwas
mit einem guten Gedächtnis noch mit einem hohen Intelligenzquotienten zu tun,
sondern mit jenem Hirnareal, das Gesichter verarbeitet. Genaueres ist aber noch
nicht bekannt. Hier wird die Wissenschaft hoffentlich noch spannende
Erkenntnisse erlangen.

Z Er hat ihn zuvor in einer anderen Aufzeichnung eines Diebstahls gesehen.`,options:[{key:"a",text:"Andere hingegen sind besonders gut darin, Gesichter zuzuordnen, wenn sie mehrere Fotos vor sich haben."},{key:"b",text:"Bei diesem Verfahren werden die charakteristischen Merkmale der Gesichtszüge anhand eines digitalisierten Bildes bestimmt."},{key:"c",text:"Betroffene sind nicht dazu in der Lage, Menschen anhand ihres Gesichts zu identifizieren."},{key:"d",text:"Doch schon jetzt eröffnet die Forschung viele Perspektiven – in der Psychologie und der kriminalistischen Praxis."},{key:"e",text:"Man vermutet, dass sie genetisch weitergegeben werden."},{key:"f",text:"So lokalisiert die Erkennungssoftware das Gesicht und berechnet seine charakteristischen Eigenschaften."},{key:"g",text:"So nennt man Menschen, die sich außergewöhnlich gut Gesichter merken können."},{key:"h",text:"Wie viele Menschen man wirklich als Super-Recogniser bezeichnen könne sei unklar."}],solution:{1:"g",2:"d",3:"c",4:"h",5:"a",6:"e"}},lv2:{title:"Leseverstehen, Teil 2 – Wenn Unternehmen Personal abbauen",questions:[{id:7,text:"erklärt der Autor eine Ursache für Unternehmensentlassungen?",solution:"c"},{id:8,text:"äußert der Autor eine kritische Bewertung der Situation?",solution:"e"},{id:9,text:"liefert der Autor eine Definition?",solution:"a"},{id:10,text:"nennt der Autor konkrete Beispiele aus der Praxis?",solution:"d"},{id:11,text:"zeigt der Autor Verwunderung über eine Entwicklung?",solution:"b"},{id:12,text:"zieht der Autor eine Schlussfolgerung oder Empfehlung?",solution:"e"}],paragraphs:[{key:"a",text:"Der Begriff „Personalabbau“ gehört seit Jahrzehnten zum Wortschatz moderner Wirtschaftsgesellschaften. Darunter versteht man Maßnahmen von Unternehmen, die darauf abzielen, die Zahl der Beschäftigten zu reduzieren. Dies kann auf unterschiedliche Weise geschehen: durch direkte Entlassungen, durch das Auslaufen befristeter Arbeitsverträge oder durch sogenannte Frühverrentungsprogramme. In wirtschaftlich schwierigen Zeiten greifen Firmen häufig zu solchen Instrumenten, um Kosten zu senken und ihre Wettbewerbsfähigkeit zu sichern. Gleichzeitig hat sich im Laufe der Zeit eine Vielzahl von euphemistischen Formulierungen entwickelt, die diesen Prozess beschreiben sollen: Man spricht etwa von „Restrukturierung“, „Effizienzsteigerung“ oder „Optimierung der Personalstruktur“. Solche Begriffe klingen technisch und neutral, verdecken jedoch häufig, dass hinter ihnen konkrete menschliche Schicksale stehen. Für die betroffenen Beschäftigten bedeutet Personalabbau nicht nur den Verlust ihres Arbeitsplatzes, sondern häufig auch eine Phase großer Unsicherheit und beruflicher Neuorientierung."},{key:"b",text:"In den letzten Jahren hat sich jedoch eine Entwicklung gezeigt, die viele Beobachter überrascht. Immer wieder berichten Unternehmen von steigenden Gewinnen und stabilen Umsätzen – und kündigen gleichzeitig umfangreiche Stellenstreichungen an. Für viele Menschen wirkt dieses Vorgehen widersprüchlich. Wie kann es sein, dass Firmen Personal abbauen, obwohl ihre wirtschaftliche Lage scheinbar solide ist? Wirtschaftsexperten erklären dieses Phänomen damit, dass Unternehmen nicht nur auf ihre aktuelle Situation reagieren, sondern vor allem auf zukünftige Erwartungen. Investoren und Aktionäre verlangen von den Unternehmensleitungen, langfristig profitabel zu bleiben und ihre Effizienz ständig zu steigern. Daher versuchen viele Firmen bereits frühzeitig, ihre Kostenstrukturen zu verändern, selbst wenn die wirtschaftliche Lage noch stabil erscheint. Dass ein Unternehmen Stellen abbaut, bedeutet also nicht unbedingt, dass es sich bereits in einer Krise befindet."},{key:"c",text:"Die Gründe für Personalabbau sind vielfältig und reichen weit über kurzfristige wirtschaftliche Schwankungen hinaus. Einer der wichtigsten Faktoren ist der technologische Wandel. Automatisierung und Digitalisierung verändern zahlreiche Arbeitsprozesse grundlegend. Tätigkeiten, die früher von mehreren Mitarbeitern erledigt wurden, können heute häufig von Maschinen oder speziellen Softwareprogrammen übernommen werden. Besonders in der Industrie und im Verwaltungsbereich hat dieser Trend zu erheblichen Veränderungen geführt. Ein weiterer wichtiger Faktor ist die Globalisierung. Unternehmen stehen unter ständigem Wettbewerbsdruck und versuchen, ihre Produkte möglichst kostengünstig herzustellen. Wenn Produktionskosten in anderen Ländern niedriger sind, verlagern Firmen ihre Standorte oder reduzieren Personal im Inland. Hinzu kommen interne Umstrukturierungen: Unternehmen passen ihre Organisation immer wieder an neue Marktbedingungen an, legen Abteilungen zusammen oder konzentrieren sich auf bestimmte Kernbereiche. All diese Entwicklungen können dazu führen, dass Arbeitsplätze wegfallen."},{key:"d",text:"Konkrete Beispiele für solche Entwicklungen lassen sich in vielen Branchen beobachten. In der Automobilindustrie etwa haben mehrere große Hersteller angekündigt, in den kommenden Jahren tausende Stellen abzubauen, weil sie ihre Produktion stärker auf Elektromobilität ausrichten wollen. Dieser technologische Wandel verändert nicht nur die Fahrzeuge selbst, sondern auch die Produktionsprozesse, sodass bestimmte Tätigkeiten künftig weniger Arbeitskräfte erfordern. Auch im Bankensektor zeigt sich ein ähnlicher Trend. Zahlreiche Filialen wurden in den vergangenen Jahren geschlossen, da immer mehr Kunden ihre Bankgeschäfte online erledigen. Dadurch verlieren klassische Schalterarbeitsplätze an Bedeutung. Im Einzelhandel wiederum sorgt der wachsende Onlinehandel dafür, dass traditionelle Geschäfte weniger Personal benötigen oder ganz verschwinden. Diese Beispiele verdeutlichen, dass Personalabbau häufig Teil umfassender struktureller Veränderungen ist und nicht allein durch kurzfristige wirtschaftliche Schwierigkeiten erklärt werden kann."},{key:"e",text:"Gleichzeitig wird in der öffentlichen Diskussion immer häufiger die Frage gestellt, ob Unternehmen ausreichend Verantwortung gegenüber ihren Beschäftigten übernehmen. Kritiker werfen einigen Konzernen vor, Personalabbau zu schnell als scheinbar einfache Lösung zu betrachten, anstatt langfristige Strategien zu entwickeln. Sie argumentieren, dass Investitionen in Weiterbildung oder interne Umschulungsprogramme für die Mitarbeiter nachhaltiger sein könnten. Andere Experten weisen jedoch darauf hin, dass wirtschaftliche Realitäten nicht ignoriert werden dürfen. Unternehmen müssen sich an veränderte Marktbedingungen anpassen, um langfristig bestehen zu können. Dennoch lässt sich aus dieser Entwicklung eine wichtige Schlussfolgerung ziehen: In einer sich schnell wandelnden Arbeitswelt wird es für Arbeitnehmer immer entscheidender, ihre Qualifikationen kontinuierlich weiterzuentwickeln. Lebenslanges Lernen ist damit nicht mehr nur ein Schlagwort, sondern eine zentrale Voraussetzung, um auch in Zukunft berufliche Chancen zu haben."}]},lv3:{title:"Leseverstehen, Teil 3 – Geisteswissenschaften: Studium ohne Aussichten",text:`Geisteswissenschaften – Studium ohne Aussichten

1 Ein Witz geht so: Zwei Männer sitzen an einer Kreuzung. Da kommt ein Reisender des Weges. Er spricht sie freundlich auf Englisch an: Wo bitte der Weg in die nächste Stadt sei? Die Männer verstehen nicht. Da versucht es der Fremde auf Italienisch und Französisch, auf Russisch und Chinesisch, schließlich auf Hochbalinesisch – Kopfschütteln. Enttäuscht kehrt der Fremde um. „Der konnte aber viele Sprachen“, sagt schließlich einer der Männer. „Na und – hat’s ihm was genützt?“, sagt der andere und zuckt mit den Schultern.

2 Es könnte auch ein Witz über Geisteswissenschaftler sein, die ins Berufsleben starten. Ihr fachliches Wissen interessiert in der Wirtschaftswelt oft keinen. Darauf, argumentieren Optimisten, komme es ja auch gar nicht an; vielmehr hätten Geisteswissenschaftler die viel gerühmten „Schlüsselqualifikationen“: Sie können sich schnell neues, auch überfachliches Wissen erschließen, können kommunizieren, organisieren und analysieren. Damit bringen sie genau das mit, was in der globalen Wissensgesellschaft gefragt ist.

3 Geisteswissenschaftler sind in dieser Perspektive die Avantgarde am Arbeitsmarkt der Wissensgesellschaft; die Unternehmen müssten sie demzufolge eigentlich umwerben und bestens entlohnen. Tun sie aber nicht, im Gegenteil.

4 Als das Hochschul-Informations-System in Hannover Absolventen aller Fachrichtungen zehn Jahre nach dem Studium befragte, wie es ihnen ergangen sei, zeigte sich: Die Geisteswissenschaftler verdienten ein Viertel weniger als der Schnitt der Absolventen und weniger als die Hälfte von dem, was der durchschnittliche Wirtschaftsingenieur aufs Konto bekommt. Ein Viertel der befragten Geisteswissenschaftler arbeitete in einem Job, in dem ein Hochschulabschluss nicht die Regel ist, und empfand die berufliche Position als nicht angemessen. Eine andere Untersuchung zeigt, dass Geisteswissenschaftler deutlich länger bis zur ersten regulären Stelle brauchen als andere Absolventen. Zudem fühlen sie sich überdurchschnittlich häufig unterfordert und verdienen auch schon zu Beginn weniger als ihre ehemaligen Kommilitonen.

5 In Untersuchungen zum Thema „Geisteswissenschaftler und Beruf“ kamen Forscher zu ernüchternden Ergebnissen: dass die hochwertige Ausbildung keinen hinreichenden Schutz vor Praktika biete, dass hinter dem hohen Anteil von Selbstständigen auch Notgründungen vermutet würden und dass Geisteswissenschaftler, um nicht arbeitslos zu werden, häufig erhebliche Flexibilität und Konzessionsbereitschaft aufbringen müssten.

7 Klara Sendler hat Geschichte, Literaturwissenschaften und Französisch studiert. Am Monatsende weiß sie manchmal nicht, wie sie das Essen zahlen soll. Knapp tausend Euro bleiben ihr im Monat zum Leben. Hätte sie sich am Ende des Studiums vorstellen können, dass es einmal so kommen würde mit dem Start ins Arbeitsleben? „Nein“, sagt sie. „Es ist besser gelaufen, als ich dachte.“ Besser? Ja, besser. Von einem „Traumjob“ spricht Klara Sendler. Sie arbeitet als selbstständige Journalistin bei einer großen Tageszeitung. Sie tut das, was sie schon immer tun wollte. Und das Geld? „Es ist nicht gerade toll, aber es reicht“, sagt sie. Auf keinen Fall würde sie mit einem Betriebswirt oder Ingenieur tauschen wollen.

8 Klara Sendlers Haltung ist typisch für viele Geisteswissenschaftler. „Ich will etwas tun, was mir Spaß macht“, lautet das Motto – auch wenn es nicht so gut bezahlt ist. Abiturienten, die Geisteswissenschaften studieren wollen, geben viel häufiger als andere an, die „persönliche Entfaltung“ sei für sie ein wichtiger Grund, um zu studieren. Die Aussicht auf einen sicheren Job und das Gehalt sind ihnen dagegen nicht so wichtig.

9 Die entscheidende Frage aber lautet: Sind Geisteswissenschaftler glücklich mit ihrem Job? Denn nur, weil sie mehr Wert auf spannenden Beruf und weniger Wert aufs Geld legen, heißt ja nicht automatisch, dass ihre Arbeit auch tatsächlich erfüllend ist. Die Zehnjahresstudie des Hochschul-Informations-System gibt auch hier eine Antwort. Egal, ob es um die Arbeitsinhalte, das Arbeitsklima oder die Ausstattung des Arbeitsplatzes geht: Immer [TEXT FEHLT]

10 Was aber können Geisteswissenschaftler tun, damit der Berufsstart nicht zu hart wird? Praktika während des Studiums, klar! Uta Glaubitz, eine von Deutschlands bekanntesten Berufsberaterinnen, spricht sich radikal dagegen aus: Gehen Sie keine Vorlesung, machen Sie kein Praktikum, ehe Sie Ihr Berufsziel definiert haben, sagt sie. Trotzdem muss man Verschiedenes ausprobieren, um zu wissen, meint Uta Glaubitz. Der Weg müsse das Ausprobieren sein, der Weg sei nicht nur die Selbstreflexion. Habe man einmal ernsthaft entschieden, in welche Richtung es gehen solle, könne man alles darauf zuschneiden, nach und nach immer höherwertige Praktika machen und Seminararbeitsthemen entsprechend danach auswählen.

11 Da ist sie mit einem Mal wieder, die leidige Frage: Was will ich einmal werden? Sie stellte sich ja schon mal. Nach dem Abi, und für manchen war ein Geisteswissenschaftler-Studium eine willkommene Möglichkeit, diese Entscheidung hinauszuzögern. Es ist paradox: Die Geisteswissenschaften ziehen Unentschlossene an, gerade weil sie keine frühe berufliche Festlegung erzwingen. Aber gerade Geisteswissenschaftler brauchen besonders viel Entschlusskraft, einen funktionierenden inneren Kompass, weil das Fach nicht auf einen bestimmten Beruf vorbereitet. Die stille Hoffnung, ein Entschluss werde schon irgendwie während des Studiums reifen, hält Uta Glaubitz für eine Illusion.

12 Marcellus Menke, Vorsitzender des Dachverbandes der Career Center an den deutschen Hochschulen, vertritt eine entspannendere Perspektive. Er ermutigt Studenten, verschiedene Berufswelten kennenzulernen. Ein Mythos seien die Erfolgsbiografien, die einen glauben machen, alles sei einem stringenten Plan gefolgt. Aber auch Menke erzählt, wie er mit den ratsuchenden Studenten an den Anfang zurückgeht. Er versuche, den Prozess der Entscheidung für den Studiengang bewusst zu machen. Da würden Motivationen sichtbar, an die man dann anknüpfen könne. Dass die Ratsuchenden immer wieder auf sich selbst verwiesen werden, sei kein Zufall. Es gebe einfach keine andere Antwort. Jeder müsse bereits im Studium ein persönliches Forschungsprojekt mit der Fragestellung: Wo Will ich hin?`,statements:[{id:13,text:"Absolventen geisteswissenschaftlicher Studien haben häufig wertvolle überfachliche Kompetenzen.",solution:"+"},{id:14,text:"Geisteswissenschaftler werden zunehmend auch von Wirtschaftsunternehmen umworben.",solution:"-"},{id:15,text:"Geisteswissenschaftler fühlen sich bei der Arbeit häufiger überfordert als Absolventen technischer oder wirtschaftlicher Studien.",solution:"-"},{id:16,text:"Die Qualität der Ausbildung scheint keinen Einfluss auf gute Verdienstmöglichkeiten zu haben.",solution:"+"},{id:17,text:"Es ist anzunehmen, dass manche Geisteswissenschaftler sich nur deshalb selbstständig machen, weil ihnen nichts anderes übrig bleibt.",solution:"+"},{id:18,text:"Selbstverwirklichung ist bei der Wahl der Geisteswissenschaften wichtig.",solution:"+"},{id:19,text:"Geisteswissenschaftler sind meistens zufriedener als Abgänger anderer Studien.",solution:"x"},{id:20,text:"Die Inhalte geisteswissenschaftlicher Studien sind zum Großteil überholt.",solution:"x"},{id:21,text:"Wirtschaftsstudenten zeigen eine geringere Tendenz als Geisteswissenschaftler, Annahmen in Frage zu stellen.",solution:"x"},{id:22,text:"Uta Glaubitz ist der Meinung, dass Nachdenken über sich selbst wichtiger sei als das Reinschnuppern in verschiedene Berufe.",solution:"+"},{id:23,text:"Geisteswissenschaftliche Studien sind besonders geeignet für noch unentschlossene Schulabgänger.",solution:"+"}],heading:{id:24,question:"Welche der Überschriften a, b oder c passt am besten zum Text?",options:{a:"Das Studium der Geisteswissenschaften in Deutschland",b:"Immer weniger Geld für geisteswissenschaftliche Studiengänge",c:"Geisteswissenschaften – Studium ohne Aussichten?"},solution:"c"}},sp:{title:"Sprachbausteine – Wohnen in der Zukunft – es wird eng",text:`Im Jahr 2045 wird es nicht einfacher werden, eine Wohnung zu finden – [[0]]
Situation wird sich nicht entspannen. In den verschiedenen Regionen haben die
Wohnungsmärkte [[25]] mit ganz unterschiedlichen Problemen zu kämpfen. Während
in manchen Großstädten die Mieten explodieren und bezahlbarer Wohnraum knapp
wird, kämpfen ländliche Gebiete [[26]] Abwanderung und Leerstand. Experten sehen
[[27]] dringenden Handlungsbedarf, um eine weitere Verschärfung der Lage zu
verhindern.

Die Bevölkerung in den Städten wächst weiter, während der verfügbare Baugrund
immer knapper wird. Prognosen zufolge werden die Mieten in Ballungsräumen in
den nächsten Jahrzehnten weiter steigen, [[28]] keine grundlegenden Maßnahmen
ergriffen werden. Gleichzeitig nimmt die Nachfrage [[29]] nachhaltigem und
bezahlbarem Wohnraum zu. Viele Menschen suchen Alternativen [[30]] klassischen
Einfamilienhaus oder [[31]] teuren Stadtwohnung.

Neue Wohnformen [[32]] Tiny Houses, Co-Living-Projekte und modulare Bauten
gewinnen an Bedeutung. Sie versprechen nicht nur geringere Kosten und einen
kleineren ökologischen Fußabdruck, [[33]] auch mehr Gemeinschaft und Flexibilität.
In Co-Living-Wohnungen teilen sich Bewohner Küche, Arbeitsräume und
Freizeitflächen – ein Modell, [[34]] besonders bei jungen Erwachsenen und Digital
Nomads beliebt ist. Tiny Houses [[35]] ermöglichen ein minimalistisches Leben auf
kleinstem Raum, oft mobil und energieautark.

[[36]] nicht alle sehen in diesen Entwicklungen nur Vorteile. Kritiker warnen [[37]]
einem Verlust an Privatsphäre und [[38]] sozialer Isolation, selbst wenn Menschen
räumlich nah beieinander wohnen. In dicht besiedelten Quartieren kann die Enge
[[39]] führen, während der Lärmpegel steigt und Grünflächen abnehmen. Zudem sind
viele innovative Wohnprojekte noch teuer [[40]] der Umsetzung und nicht [[41]] alle
Einkommensschichten zugänglich.

Die Politik steht [[42]] der Aufgabe, den Wohnungsbau zu beschleunigen und
gleichzeitig Nachhaltigkeit und soziale Gerechtigkeit zu gewährleisten.
Baugenehmigungen müssen schneller erteilt werden, Flächen [[43]] den
Wohnungsbau freigegeben und Förderprogramme [[44]] energieeffizientes Bauen
ausgebaut werden. Gleichzeitig gilt es, den Leerstand auf dem Land zu reduzieren
und attraktive Angebote [[45]] zu schaffen. Ob die Zukunft des Wohnens enger oder
